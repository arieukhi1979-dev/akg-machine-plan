<script>
(function(){
  const DB_ENDPOINT = '/api/plans';
  const LS_KEY = 'mpv5_plans_v5';
  let lastHash='';
  function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}
  async function load(){try{const r=await fetch(DB_ENDPOINT+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const t=await r.text();if(!t)return;const h=hash(t);if(h!==lastHash){const l=localStorage.getItem(LS_KEY)||'';if(hash(l)!==h){localStorage.setItem(LS_KEY,t);lastHash=h;}} }catch(e){}}
  async function save(){const d=localStorage.getItem(LS_KEY);if(!d||hash(d)===lastHash)return;try{await fetch(DB_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:d});lastHash=hash(d);}catch(e){}}
  const orig=localStorage.setItem.bind(localStorage);let t=null;localStorage.setItem=function(k,v){orig(k,v);if(k===LS_KEY){clearTimeout(t);t=setTimeout(save,1000);}};setInterval(load,30000);setTimeout(load,1000);
})();
</script>
